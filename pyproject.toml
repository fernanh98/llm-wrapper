[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wrapper"
version = "0.1.0"
description = "A small, provider-agnostic wrapper around LLM APIs"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "openai", "pydantic", "wrapper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "openai>=3.46,<4",
    "httpx2>=2.12,<3",
]

[tool.setuptools]
packages = ["llm_wrapper", "llm_wrapper.src"]
